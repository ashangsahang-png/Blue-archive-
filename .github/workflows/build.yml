name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak ZIP
        run: |
          mkdir work
          for z in GitHub_bagian*.zip; do unzip -q -o "$z" -d work; done
          echo "Jumlah karakter: $(ls work/BlueRunner/app/src/main/assets/www/chars | wc -l)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Terima lisensi Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: work/BlueRunner
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlueRunner-APK
          path: work/BlueRunner/app/build/outputs/apk/debug/app-debug.apk
